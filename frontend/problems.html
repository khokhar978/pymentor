<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Practice | khokhar.in.net</title>
    <meta name="description" content="Practice Python programming problems topic-wise with step-by-step guidance.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4">
    <link rel="alternate icon" href="/favicon.ico?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
        (function() {
            try {
                var s = localStorage.getItem('pymentor_theme');
                var t = (s === 'light' || s === 'dark') ? s : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <script type="module" src="/js/shared/theme.js"></script>
    <link rel="stylesheet" href="/css/style.css?v=3.1">
</head>
<body>
    <header class="site-header">
        <a href="/" class="header-brand">
            <img src="/favicon.svg" alt="PyMentor" class="brand-icon-img">
            <span>Python Practice</span>
            <span class="brand-sub">BCA Lab</span>
        </a>
        <div class="header-spacer"></div>
        <button id="themeToggleBtn" class="btn-theme-toggle" onclick="window.toggleTheme()" aria-label="Toggle theme" title="Toggle theme">🌙</button>
        <div id="studentBadge" class="student-badge" title="Click to change details">
            <span>🎓</span>
            <span class="s-name" id="studentNameDisplay">Not Logged In</span>
            <span class="s-sec" id="studentSecDisplay">Enter Details</span>
        </div>
        <button id="switchStudentBtn" class="btn-switch">Profile</button>
    </header>

    <div class="problems-page">
        <div class="page-hero">
            <div class="hero-left">
                <h1>Practice Problems</h1>
                <p>Select a topic to expand questions. Track your progress with step-by-step guidance.</p>
            </div>
            <div class="hero-actions">
                <button id="toggleAllBtn" class="btn-toggle-all" type="button" title="Expand or collapse all topics">
                    <span id="toggleAllIcon">▾</span>
                    <span id="toggleAllText">Expand All</span>
                </button>
            </div>
        </div>

        <div id="topicsContainer">
            <p style="color: var(--text-faint); font-size: 13px;">Loading problems...</p>
        </div>
    </div>

    <footer class="page-footer">
        Python Practice Lab &mdash; <a href="https://khokhar.in.net" target="_blank">khokhar.in.net</a>
    </footer>

    <script type="module" src="/js/problems.js?v=2.7"></script>
</body>
</html>
