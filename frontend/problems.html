<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Practice | khokhar.in.net</title>
    <meta name="description" content="Practice Python programming problems topic-wise with step-by-step guidance.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=2.5">
</head>
<body>
    <header class="site-header">
        <a href="/" class="header-brand">
            <span class="brand-icon">🐍</span>
            <span>Python Practice</span>
            <span class="brand-sub">BCA Lab</span>
        </a>
        <div class="header-spacer"></div>
        <div id="studentBadge" class="student-badge" title="Click to change details">
            <span>🎓</span>
            <span class="s-name" id="studentNameDisplay">Not Logged In</span>
            <span class="s-sec" id="studentSecDisplay">Enter Details</span>
        </div>
        <button id="switchStudentBtn" class="btn-switch">Profile</button>
    </header>

    <div class="problems-page">
        <div class="page-hero">
            <div class="hero-left">
                <h1>Practice Problems</h1>
                <p>Select a topic to expand questions. Track your progress with step-by-step guidance.</p>
            </div>
            <div class="hero-actions">
                <button id="toggleAllBtn" class="btn-toggle-all" type="button" title="Expand or collapse all topics">
                    <span id="toggleAllIcon">▾</span>
                    <span id="toggleAllText">Expand All</span>
                </button>
            </div>
        </div>

        <div id="topicsContainer">
            <p style="color: var(--text-faint); font-size: 13px;">Loading problems...</p>
        </div>
    </div>

    <footer class="page-footer">
        Python Practice Lab &mdash; <a href="https://khokhar.in.net" target="_blank">khokhar.in.net</a>
    </footer>

    <script src="/js/problems.js?v=2.5"></script>
</body>
</html>
