<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Practice | khokhar.in.net</title>
    <meta name="description" content="Practice Python programming problems topic-wise with step-by-step guidance.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <a href="/" class="header-brand">
            <span class="brand-icon">🐍</span>
            <span>Python Practice</span>
            <span class="brand-sub">BCA Lab</span>
        </a>
        <div class="header-spacer"></div>
        <div id="studentBadge" class="student-badge" title="Click to change details">
            <span>🎓</span>
            <span class="s-name" id="studentNameDisplay">Not Logged In</span>
            <span class="s-sec" id="studentSecDisplay">Enter Details</span>
        </div>
        <button id="switchStudentBtn" class="btn-switch">Profile</button>
    </header>

    <div class="problems-page">
        <div class="page-hero">
            <h1>Practice Problems</h1>
            <p>Choose a topic and problem below to start coding. Get step-by-step guidance as you practice.</p>
        </div>
        <div id="topicsContainer">
            <p style="color: var(--text-faint); font-size: 13px;">Loading problems...</p>
        </div>
    </div>

    <footer class="page-footer">
        Python Practice Lab &mdash; <a href="https://khokhar.in.net" target="_blank">khokhar.in.net</a>
    </footer>



    <script src="/js/problems.js"></script>
</body>
</html>
