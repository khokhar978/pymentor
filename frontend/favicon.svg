<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueSnake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="yellowSnake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="1.5" />

  <!-- Python Snakes Group -->
  <g filter="url(#glow)" transform="translate(6, 6) scale(0.8125)">
    <!-- Blue Snake (Top-Left) -->
    <path d="M 31.8,1 C 18.2,1 19.3,6.9 19.3,6.9 L 19.3,13 L 32.2,13 L 32.2,14.9 L 14.5,14.9 C 8.2,14.9 3,19.8 3,28.8 C 3,37.8 7.5,37.1 7.5,37.1 L 11.2,37.1 L 11.2,31.7 C 11.2,25.6 16.4,25.6 16.4,25.6 L 29.4,25.6 C 35.8,25.6 35.8,19.5 35.8,19.5 L 35.8,7.3 C 35.8,7.3 36.6,1 31.8,1 Z" fill="url(#blueSnake)"/>
    <!-- Blue eye -->
    <circle cx="23.5" cy="5.2" r="1.8" fill="#ffffff"/>

    <!-- Yellow Snake (Bottom-Right) -->
    <path d="M 32.2,63 C 45.8,63 44.7,57.1 44.7,57.1 L 44.7,51 L 31.8,51 L 31.8,49.1 L 49.5,49.1 C 55.8,49.1 61,44.2 61,35.2 C 61,26.2 56.5,26.9 56.5,26.9 L 52.8,26.9 L 52.8,32.3 C 52.8,38.4 47.6,38.4 47.6,38.4 L 34.6,38.4 C 28.2,38.4 28.2,44.5 28.2,44.5 L 28.2,56.7 C 28.2,56.7 27.4,63 32.2,63 Z" fill="url(#yellowSnake)"/>
    <!-- Yellow eye -->
    <circle cx="40.5" cy="58.8" r="1.8" fill="#ffffff"/>
  </g>
</svg>
